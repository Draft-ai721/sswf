<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f4ef"><title>账号 · 共创设计工作坊</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/account.css"></head><body><main class="account-shell"><a class="account-brand" href="/"><img src="/assets/favicon.svg" alt="">共创 · 设计 AI 工作坊</a><section class="account-card"><p class="eyebrow">CO-CREATE STUDIO</p><h1 id="account-title">正在读取账号…</h1><p id="account-description" class="account-description"></p><p id="account-error" class="account-message" role="alert" hidden></p><section id="signed-out" hidden><form id="credentials-form"><div id="name-field" class="form-field" hidden><label for="account-name">你的称呼</label><input id="account-name" name="name" maxlength="80" autocomplete="name"></div><div id="token-field" class="form-field" hidden><label for="account-token">工作坊初始化码</label><input id="account-token" name="token" type="password" autocomplete="off" maxlength="200"></div><div id="email-field" class="form-field"><label for="account-email">邮箱</label><input id="account-email" name="email" type="email" maxlength="254" autocomplete="username" required></div><div class="form-field"><label for="account-password">密码</label><input id="account-password" name="password" type="password" minlength="10" maxlength="128" autocomplete="current-password" required><small>至少 10 个字符。密码和个人材料仅供你的账号使用。</small></div><button id="credentials-submit" type="submit" class="btn primary">登录工作坊</button></form><p class="account-footnote">新成员请使用管理员提供的账号邀请链接。</p></section><section id="signed-in" hidden><div class="account-identity"><strong id="identity-name"></strong><p id="identity-email"></p></div><div class="row"><a class="btn primary" id="return-link" href="/">进入工作坊</a><button id="logout" class="btn secondary">退出登录</button></div><section id="admin-section" hidden><h2>邀请工作坊成员</h2><p>为学生或教师创建独立账号。设计评审权限仍由项目所有者在评审室中授予。</p><form id="account-invite-form"><div class="form-field"><label for="invite-email">受邀成员邮箱</label><input id="invite-email" name="email" type="email" required maxlength="254"></div><button class="btn secondary" type="submit">生成账号邀请</button></form><div id="invitation-result" hidden><label for="activation-url">一次性账号邀请链接</label><input id="activation-url" readonly><p>请私下交给受邀成员；有效期 7 天，激活后失效。账号邮箱由该邀请确定。</p><button id="copy-invite" class="btn text">复制链接</button></div></section></section></section><p class="account-footer">公开浏览 · 私人材料 · 围绕作品展开讨论</p></main><script type="module" src="/account.js"></script></body></html>
